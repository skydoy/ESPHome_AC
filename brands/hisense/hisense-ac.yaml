# Brand package: Hisense AC over the RS-485 "XM" bus (F4 F5 ... F4 FB frames, 9600 8N1).
# Adapter: RS-485 transceiver (M5Stack Hat RS485), see brands/hisense/hardware.md.
# The hisense_ac component lives in this repository (components/hisense_ac, PolyForm-Noncommercial-1.0.0).
#
# Needs from the board package: substitutions ac_tx_pin / ac_rx_pin / ac_tx_ignore_strapping.
# Needs from core/diagnostics.yaml: time id "ha_time" (daily energy).
# Provides the generic ids used by core/screen/*: ac_climate, ac_link, ac_link_status,
# ac_fault, ac_fault_codes, ac_outdoor_temperature.
substitutions:
  # Where ESPHome fetches the component from: the release tag that matches this config's
  # project_version (set in devices/<board>.yaml), so the YAML packages and the C++ component
  # always come from the SAME release. A tag never changes, so ESPHome's git cache can never
  # serve a stale or mismatched copy. CI and local builds pass "../components" instead.
  hisense_component_source: github://skydoy/ESPHome_AC@v${project_version}
  # How often ESPHome re-fetches the component source. A release tag is immutable; set "0s"
  # only if you point hisense_component_source at a branch (e.g. @main for development).
  hisense_component_refresh: 1d

external_components:
  - source: ${hisense_component_source}
    components: [hisense_ac, hisense_proto]
    refresh: ${hisense_component_refresh}

uart:
  id: ac_uart
  tx_pin:
    number: ${ac_tx_pin}
    ignore_strapping_warning: ${ac_tx_ignore_strapping}   # set by the board ("true" for G0 on the Plus2)
  rx_pin: ${ac_rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: hisense_ac
    id: ac_climate
    name: "Air Conditioner"
    uart_id: ac_uart
    # Link bring-up used by the stock W41H1 module (device type, version, heartbeat).
    # Older W4x units also accept it; set to false for plain status polling only.
    handshake: true
    # Enable if your indoor unit has a motorised horizontal louvre.
    horizontal_swing: false
    # Sleep profile used by the SLEEP preset (1-4).
    sleep_profile: 1
    # Raw frame logging at DEBUG level (status replies at most every debug_frames_interval,
    # commands always). The "AC Frame Logging" switch below toggles it at runtime.
    debug_frames: false
    debug_frames_interval: 10s
    outdoor_temperature:
      name: "Outdoor Temperature"
      id: ac_outdoor_temperature
    indoor_coil_temperature:
      name: "Indoor Coil Temperature"
    outdoor_coil_temperature:
      name: "Outdoor Coil Temperature"
    compressor_frequency:
      name: "Compressor Frequency"
      id: ac_compressor_frequency   # used by core/health.yaml
    compressor_target_frequency:
      name: "Compressor Target Frequency"
    # Humidity, voltage and current are only reported by some units: hidden by default,
    # and they stay "unknown" until the AC sends a real value.
    humidity:
      name: "Indoor Humidity"
      disabled_by_default: true
    voltage:
      name: "Supply Voltage"
      disabled_by_default: true
    power:
      name: "Power"
      id: ac_power
    current:
      name: "Current"
      disabled_by_default: true
    connected:
      name: "AC Link"
      id: ac_link
    fault:
      name: "AC Fault"
      id: ac_fault
    fault_codes:
      name: "AC Fault Codes"
      id: ac_fault_codes
    link_status:
      name: "AC Link Status"
      id: ac_link_status
    # AC firmware version (class 07 reply, best-effort decoding) and RS-485 bus error counters.
    ac_firmware_version:
      name: "AC Firmware Version"
    bus_checksum_errors:
      name: "AC Bus Checksum Errors"
    bus_framing_errors:
      name: "AC Bus Framing Errors"
    # Less useful diagnostics: hidden by default, enable them in Home Assistant if needed.
    humidity_setpoint:
      name: "Humidity Set Point"
      disabled_by_default: true
    panel_unit:
      name: "AC Panel Unit"
      disabled_by_default: true
    capabilities:
      name: "AC Capabilities"
      disabled_by_default: true
    device_type:
      name: "AC Device Type"
      disabled_by_default: true
    # Read-only identify (boot + Identify AC button): summary + prefilled GitHub report URL.
    # Optional anonymous auto-report to the Cloudflare Worker (no raw MAC/IP; hashed device id).
    http_request_id: ac_http_request
    auto_report_url: https://esphome-ac-report.esphome-ac-report.workers.dev/report
    report_board: ${board_id}
    auto_report_switch:
      name: "Auto report"
    ac_identity:
      name: "AC Identity"
    report_url:
      name: "Report my AC"
    identify_button:
      name: "Identify AC"
    aux_heater:
      name: "Auxiliary Heater"
    display:
      name: "AC Display"
    beep_switch:
      name: "AC Beep"
    frame_log_switch:
      name: "AC Frame Logging"
    # Dedicated controls (ConnectLife-style), kept in sync with the climate presets / fan mode.
    eco_switch:
      name: "Eco"
    super_switch:
      name: "Super"
    fan_mute_switch:
      name: "Fan Mute"
    sleep_mode:
      name: "Sleep Mode"
    light_on_button:
      name: "Light On"
    light_off_button:
      name: "Light Off"
    # One problem sensor per fault bit (diagnostic). "AC Fault Codes" above lists them as text.
    fault_indoor_temperature_sensor:
      name: "Indoor Temperature Sensor Failure"
    fault_indoor_coil_sensor:
      name: "Indoor Coil Temperature Sensor Failure"
    fault_indoor_humidity_sensor:
      name: "Indoor Humidity Sensor Failure"
    fault_water_tank_full:
      name: "Water Tank Full"
    fault_indoor_fan_motor:
      name: "Indoor Fan Motor Failure"
    fault_grille_protection:
      name: "Cabinet Grille Protection Alarm"
    fault_zero_crossing:
      name: "Indoor Voltage Zero-Crossing Fault"
    fault_indoor_outdoor_communication:
      name: "Indoor-Outdoor Communication Failure"
    fault_display_communication:
      name: "Indoor Board-Display Communication Failure"
    fault_keypad_communication:
      name: "Indoor Board-Keypad Communication Failure"
    fault_wifi_communication:
      name: "WiFi-Indoor Communication Failure"
    fault_electrical:
      name: "Electrical Fault"
    fault_indoor_eeprom:
      name: "Indoor Control Board EEPROM Error"
    fault_outdoor_eeprom:
      name: "Outdoor EEPROM Error"
    fault_outdoor_coil_sensor:
      name: "Outdoor Coil Temperature Sensor Failure"
    fault_discharge_sensor:
      name: "Exhaust Temperature Sensor Failure"
    fault_outdoor_temperature_sensor:
      name: "Outdoor Ambient Temperature Sensor Failure"
    fault_overheat_protection:
      name: "Overheat or Overcool Protection"
    fault_high_discharge_temperature:
      name: "High Discharge Temperature Protection"

sensor:
  - platform: total_daily_energy
    name: "Energy Today"
    power_id: ac_power
    method: left
    restore: true

  # ---- Room sensor and heating / cooling rate ----
  # Temperature measured by the AC's own sensor (return air, near the ceiling). With "Follow
  # Room Sensor" on, the climate entity shows the room sensor instead.
  - platform: template
    id: ac_sensor_temperature
    name: "AC Sensor Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(ac_climate).ac_sensor_temperature();
  # EXPERIMENTAL: bytes 55-56 of the 160-byte status frame (W41H1-type units) as a 16-bit
  # number. On an AEH-W41H1 unit it ramps smoothly with the compressor (2740 -> 3340 in 30 s
  # at 45 Hz, heating), which looks like the heating / cooling output the official app showed,
  # not the electrical power. Not confirmed yet: compare with a meter on the AC circuit.
  - platform: template
    id: ac_output_power
    name: "Output Power (experimental)"
    icon: mdi:heat-wave
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (id(ac_climate).status_len() < 160) return NAN;
      const int v = id(ac_climate).status_u16(55);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "Output Power BTU (experimental)"
    icon: mdi:heat-wave
    unit_of_measurement: "BTU/h"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const float w = id(ac_output_power).state;
      return std::isnan(w) ? NAN : w * 3.412f;
  # How fast the room warms up / cools down while the AC heats / cools (°C per hour), from
  # the last 30 min (room sensor when following it, otherwise the AC sensor). Empty while
  # the AC is not heating / cooling or during its first 10 min of it.
  - platform: template
    id: heating_rate
    name: "Heating Rate"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C/h"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: cooling_rate
    name: "Cooling Rate"
    icon: mdi:thermometer-chevron-down
    unit_of_measurement: "°C/h"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

# Room temperature input. A Shelly H&T (Plus / Gen3 / Gen4) sends it straight to the device,
# without Home Assistant, with a webhook on "Temperature change":
#   http://<device-ip>/number/Room%20Temperature/set?value=${ev.tC}
# Home Assistant can also set it. Readings older than 4 h are ignored.
number:
  - platform: template
    id: room_temperature_input
    name: "Room Temperature"
    icon: mdi:home-thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: -30
    max_value: 60
    step: 0.1
    mode: box
    optimistic: true
    entity_category: config
    set_action:
      - lambda: id(ac_climate).set_room_temperature(x);

switch:
  # Byte hunt: logs the whole status frame once a minute with the decoded values, and the
  # device's web page collects those lines into a CSV to download. Used to find fields not
  # decoded yet (e.g. heating / cooling output). Off after every restart.
  - platform: template
    id: byte_hunt_switch
    name: "Byte Hunt"
    icon: mdi:magnify-scan
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF
    lambda: return id(ac_climate).byte_hunt();
    turn_on_action:
      - lambda: id(ac_climate).set_byte_hunt(true);
    turn_off_action:
      - lambda: id(ac_climate).set_byte_hunt(false);
  # Some Hisense units swap the panel-light commands: if "Light On" turns the light off,
  # turn this on. Applies to Light On / Light Off and the AC Display switch.
  - platform: template
    id: invert_light_switch
    name: "Invert Panel Light"
    icon: mdi:swap-horizontal
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(ac_climate).invert_light();
    turn_on_action:
      - lambda: id(ac_climate).set_invert_light(true);
    turn_off_action:
      - lambda: id(ac_climate).set_invert_light(false);
  - platform: template
    id: follow_room_switch
    name: "Follow Room Sensor"
    icon: mdi:home-thermometer-outline
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(ac_climate).follow_room();
    turn_on_action:
      - lambda: id(ac_climate).set_follow_room(true);
    turn_off_action:
      - lambda: id(ac_climate).set_follow_room(false);

interval:
  - interval: 60s
    then:
      - lambda: |-
          // 30 one-minute samples of the room temperature while the AC heats or cools.
          static float buf[30];
          static uint8_t n = 0, head = 0;
          static int last_action = -1;
          const auto action = id(ac_climate).action;
          const float t = id(ac_climate).current_temperature;
          const bool heating = action == climate::CLIMATE_ACTION_HEATING;
          const bool cooling = action == climate::CLIMATE_ACTION_COOLING;
          if ((int) action != last_action || std::isnan(t)) {
            n = 0;
            head = 0;
            last_action = (int) action;
          }
          if (!heating && !cooling) {
            if (!std::isnan(id(heating_rate).state)) id(heating_rate).publish_state(NAN);
            if (!std::isnan(id(cooling_rate).state)) id(cooling_rate).publish_state(NAN);
            return;
          }
          if (std::isnan(t))
            return;
          buf[head] = t;
          head = (head + 1) % 30;
          if (n < 30) n++;
          if (n < 10)
            return;  // need 10 min of data
          // Least-squares slope over the samples (oldest first), in degC per hour.
          const uint8_t start = (head + 30 - n) % 30;
          float sx = 0, sy = 0, sxx = 0, sxy = 0;
          for (uint8_t i = 0; i < n; i++) {
            const float x = i, y = buf[(start + i) % 30];
            sx += x; sy += y; sxx += x * x; sxy += x * y;
          }
          const float den = n * sxx - sx * sx;
          if (den == 0) return;
          const float per_hour = (n * sxy - sx * sy) / den * 60.0f;
          if (heating) {
            id(heating_rate).publish_state(per_hour);
            if (!std::isnan(id(cooling_rate).state)) id(cooling_rate).publish_state(NAN);
          } else {
            id(cooling_rate).publish_state(-per_hour);
            if (!std::isnan(id(heating_rate).state)) id(heating_rate).publish_state(NAN);
          }
