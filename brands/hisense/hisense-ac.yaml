# Brand package: Hisense AC over the RS-485 "XM" bus (F4 F5 ... F4 FB frames, 9600 8N1).
# Adapter: RS-485 transceiver (M5Stack Hat RS485), see brands/hisense/hardware.md.
# The hisense_ac component lives in this repository (components/hisense_ac, PolyForm-Noncommercial-1.0.0).
#
# Needs from the board package: substitutions ac_tx_pin / ac_rx_pin / ac_tx_ignore_strapping.
# Needs from core/diagnostics.yaml: time id "ha_time" (daily energy).
# Provides the generic ids used by core/screen/*: ac_climate, ac_link, ac_link_status,
# ac_fault, ac_fault_codes, ac_outdoor_temperature.
substitutions:
  # Where ESPHome fetches the component from. The release workflow switches this to the
  # local "../components" folder so every release is built from its own tagged source.
  hisense_component_source: github://skydoy/ESPHome_AC@main

external_components:
  - source: ${hisense_component_source}
    components: [hisense_ac]

uart:
  id: ac_uart
  tx_pin:
    number: ${ac_tx_pin}
    ignore_strapping_warning: ${ac_tx_ignore_strapping}   # set by the board ("true" for G0 on the Plus2)
  rx_pin: ${ac_rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: hisense_ac
    id: ac_climate
    name: "Air Conditioner"
    uart_id: ac_uart
    # Link bring-up used by the stock W41H1 module (device type, version, heartbeat).
    # Older W4x units also accept it; set to false for plain status polling only.
    handshake: true
    # Enable if your indoor unit has a motorised horizontal louvre.
    horizontal_swing: false
    # Sleep profile used by the SLEEP preset (1-4).
    sleep_profile: 1
    # Raw frame logging at DEBUG level (status replies at most every debug_frames_interval,
    # commands always). The "AC Frame Logging" switch below toggles it at runtime.
    debug_frames: false
    debug_frames_interval: 10s
    outdoor_temperature:
      name: "Outdoor Temperature"
      id: ac_outdoor_temperature
    indoor_coil_temperature:
      name: "Indoor Coil Temperature"
    outdoor_coil_temperature:
      name: "Outdoor Coil Temperature"
    compressor_frequency:
      name: "Compressor Frequency"
    compressor_target_frequency:
      name: "Compressor Target Frequency"
    # Humidity, voltage and current are only reported by some units: hidden by default,
    # and they stay "unknown" until the AC sends a real value.
    humidity:
      name: "Indoor Humidity"
      disabled_by_default: true
    voltage:
      name: "Supply Voltage"
      disabled_by_default: true
    power:
      name: "Power"
      id: ac_power
    current:
      name: "Current"
      disabled_by_default: true
    connected:
      name: "AC Link"
      id: ac_link
    fault:
      name: "AC Fault"
      id: ac_fault
    fault_codes:
      name: "AC Fault Codes"
      id: ac_fault_codes
    link_status:
      name: "AC Link Status"
      id: ac_link_status
    aux_heater:
      name: "Auxiliary Heater"
    display:
      name: "AC Display"
    beep_switch:
      name: "AC Beep"
    frame_log_switch:
      name: "AC Frame Logging"
    # Dedicated controls (ConnectLife-style), kept in sync with the climate presets / fan mode.
    eco_switch:
      name: "Eco"
    super_switch:
      name: "Super"
    fan_mute_switch:
      name: "Fan Mute"
    sleep_mode:
      name: "Sleep Mode"
    light_on_button:
      name: "Light On"
    light_off_button:
      name: "Light Off"
    # One problem sensor per fault bit (diagnostic). "AC Fault Codes" above lists them as text.
    fault_indoor_temperature_sensor:
      name: "Indoor Temperature Sensor Failure"
    fault_indoor_coil_sensor:
      name: "Indoor Coil Temperature Sensor Failure"
    fault_indoor_humidity_sensor:
      name: "Indoor Humidity Sensor Failure"
    fault_water_tank_full:
      name: "Water Tank Full"
    fault_indoor_fan_motor:
      name: "Indoor Fan Motor Failure"
    fault_grille_protection:
      name: "Cabinet Grille Protection Alarm"
    fault_zero_crossing:
      name: "Indoor Voltage Zero-Crossing Fault"
    fault_indoor_outdoor_communication:
      name: "Indoor-Outdoor Communication Failure"
    fault_display_communication:
      name: "Indoor Board-Display Communication Failure"
    fault_keypad_communication:
      name: "Indoor Board-Keypad Communication Failure"
    fault_wifi_communication:
      name: "WiFi-Indoor Communication Failure"
    fault_electrical:
      name: "Electrical Fault"
    fault_indoor_eeprom:
      name: "Indoor Control Board EEPROM Error"
    fault_outdoor_eeprom:
      name: "Outdoor EEPROM Error"
    fault_outdoor_coil_sensor:
      name: "Outdoor Coil Temperature Sensor Failure"
    fault_discharge_sensor:
      name: "Exhaust Temperature Sensor Failure"
    fault_outdoor_temperature_sensor:
      name: "Outdoor Ambient Temperature Sensor Failure"
    fault_overheat_protection:
      name: "Overheat or Overcool Protection"
    fault_high_discharge_temperature:
      name: "High Discharge Temperature Protection"

sensor:
  - platform: total_daily_energy
    name: "Energy Today"
    power_id: ac_power
    method: left
    restore: true
