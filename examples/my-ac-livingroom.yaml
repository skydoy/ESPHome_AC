# Example for people who build in their own ESPHome Device Builder using the remote packages
# (instead of the pre-built firmware from the web installer).
substitutions:
  name: ac-living-room
  friendly_name: AC Living Room

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  hisense_m5:
    url: https://github.com/skydoy/ESPHome_AC
    ref: v0.2.10   # a release tag: immutable, matches the component tag; bump it to update
    files:
      - core/boards/m5stickc-plus2.yaml   # or core/boards/atom-lite.yaml (then drop the screen)
      - core/screen/m5stickc-plus2.yaml   # optional status screen
      - core/diagnostics.yaml             # provides the time source used by "Energy Today"
      - brands/hisense/hisense-ac.yaml
      - core/web-server.yaml              # optional: web page at http://<device-ip>/ (no login)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
# Optional but recommended: encrypt the API and protect OTA. The packages set neither,
# so the pre-built firmware keeps working without a key. Generate a key with:
#   openssl rand -base64 32
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
logger:
