<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="920" height="560" fill="#ffffff"/>
<text x="460" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Wiring: AC Wi-Fi port → M5 RS485 Hat → M5StickC Plus2</text>
<text x="460" y="58" text-anchor="middle" font-size="14" fill="#555">Measure X to GND first (AC powered, plug disconnected). Then use the panel that matches.</text>
<rect x="20" y="76" width="440" height="400" rx="14" fill="#f7f8fa" stroke="#d0d4da"/>
<text x="240" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#d62828">X measures 5 V</text>
<rect x="40" y="115" width="130" height="170" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="105.0" y="302" text-anchor="middle" font-size="12" fill="#333">AC Wi-Fi port</text>
<text x="105.0" y="317" text-anchor="middle" font-size="11" fill="#777">(order varies by model)</text>
<text x="52" y="145" font-size="14" font-weight="600" fill="#1f6fd1">B (−)</text>
<circle cx="170" cy="140" r="5" fill="#1f6fd1"/>
<text x="52" y="185" font-size="14" font-weight="600" fill="#e08a00">A (+)</text>
<circle cx="170" cy="180" r="5" fill="#e08a00"/>
<text x="52" y="225" font-size="14" font-weight="600" fill="#d62828">X  (+5 V)</text>
<circle cx="170" cy="220" r="5" fill="#d62828"/>
<text x="52" y="265" font-size="14" font-weight="600" fill="#222222">GND</text>
<circle cx="170" cy="260" r="5" fill="#222222"/>
<rect x="290" y="115" width="150" height="170" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="365.0" y="302" text-anchor="middle" font-size="12" fill="#333">M5 RS485 Hat terminal</text>
<circle cx="290" cy="140" r="5" fill="#1f6fd1"/>
<text x="304" y="145" font-size="14" font-weight="600" fill="#1f6fd1">1  B</text>
<circle cx="290" cy="180" r="5" fill="#e08a00"/>
<text x="304" y="185" font-size="14" font-weight="600" fill="#e08a00">2  A</text>
<circle cx="290" cy="220" r="5" fill="#aaa"/>
<text x="304" y="225" font-size="14" font-weight="600" fill="#aaa">3  12V  (leave empty)</text>
<circle cx="290" cy="260" r="5" fill="#222222"/>
<text x="304" y="265" font-size="14" font-weight="600" fill="#222222">4  GND</text>
<line x1="170" y1="140" x2="290" y2="140" stroke="#1f6fd1" stroke-width="4" stroke-linecap="round"/>
<line x1="170" y1="180" x2="290" y2="180" stroke="#e08a00" stroke-width="4" stroke-linecap="round"/>
<line x1="170" y1="260" x2="290" y2="260" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<rect x="290" y="345" width="150" height="110" rx="10" fill="#ff6b35" fill-opacity="0.12" stroke="#ff6b35" stroke-width="1.5"/>
<text x="365.0" y="369" text-anchor="middle" font-size="14" font-weight="700" fill="#333">M5StickC Plus2</text>
<text x="365.0" y="387" text-anchor="middle" font-size="11" fill="#666">(plugged into the hat)</text>
<path d="M170 220 H235 V420 H290" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="290" cy="420" r="5" fill="#d62828"/>
<text x="302" y="425" font-size="13" font-weight="600" fill="#d62828">5V header pin</text>
<text x="302" y="444" font-size="11" fill="#666">(not the 12V terminal)</text>
<rect x="460" y="76" width="440" height="400" rx="14" fill="#f7f8fa" stroke="#d0d4da"/>
<text x="680" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#d62828">X measures 12 V</text>
<rect x="480" y="115" width="130" height="170" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="545.0" y="302" text-anchor="middle" font-size="12" fill="#333">AC Wi-Fi port</text>
<text x="545.0" y="317" text-anchor="middle" font-size="11" fill="#777">(order varies by model)</text>
<text x="492" y="145" font-size="14" font-weight="600" fill="#1f6fd1">B (−)</text>
<circle cx="610" cy="140" r="5" fill="#1f6fd1"/>
<text x="492" y="185" font-size="14" font-weight="600" fill="#e08a00">A (+)</text>
<circle cx="610" cy="180" r="5" fill="#e08a00"/>
<text x="492" y="225" font-size="14" font-weight="600" fill="#d62828">X  (+12 V)</text>
<circle cx="610" cy="220" r="5" fill="#d62828"/>
<text x="492" y="265" font-size="14" font-weight="600" fill="#222222">GND</text>
<circle cx="610" cy="260" r="5" fill="#222222"/>
<rect x="730" y="115" width="150" height="170" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="805.0" y="302" text-anchor="middle" font-size="12" fill="#333">M5 RS485 Hat terminal</text>
<circle cx="730" cy="140" r="5" fill="#1f6fd1"/>
<text x="744" y="145" font-size="14" font-weight="600" fill="#1f6fd1">1  B</text>
<circle cx="730" cy="180" r="5" fill="#e08a00"/>
<text x="744" y="185" font-size="14" font-weight="600" fill="#e08a00">2  A</text>
<circle cx="730" cy="220" r="5" fill="#d62828"/>
<text x="744" y="225" font-size="14" font-weight="600" fill="#d62828">3  12V</text>
<circle cx="730" cy="260" r="5" fill="#222222"/>
<text x="744" y="265" font-size="14" font-weight="600" fill="#222222">4  GND</text>
<line x1="610" y1="140" x2="730" y2="140" stroke="#1f6fd1" stroke-width="4" stroke-linecap="round"/>
<line x1="610" y1="180" x2="730" y2="180" stroke="#e08a00" stroke-width="4" stroke-linecap="round"/>
<line x1="610" y1="260" x2="730" y2="260" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<rect x="730" y="345" width="150" height="110" rx="10" fill="#ff6b35" fill-opacity="0.12" stroke="#ff6b35" stroke-width="1.5"/>
<text x="805.0" y="369" text-anchor="middle" font-size="14" font-weight="700" fill="#333">M5StickC Plus2</text>
<text x="805.0" y="387" text-anchor="middle" font-size="11" fill="#666">(plugged into the hat)</text>
<line x1="610" y1="220" x2="730" y2="220" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
<text x="805.0" y="415" text-anchor="middle" font-size="12" fill="#333">Powered by the hat:</text>
<text x="805.0" y="433" text-anchor="middle" font-size="12" fill="#333">12 V → 5 V (AOZ1282)</text>
<rect x="20" y="490" width="880" height="56" rx="10" fill="#fff4e5" stroke="#f0a020"/>
<text x="36" y="513" font-size="14" fill="#333"><tspan font-weight="700">Safety:</tspan> switch the AC off at the breaker before opening it. A and B are signal only, never power.</text>
<text x="36" y="535" font-size="14" fill="#333"><tspan font-weight="700">Boot pin G0:</tspan> if the Stick boots from USB but not from the AC, add a 10 kΩ pull-up from G0 to 3.3 V.</text>
</svg>
