# Device: Hisense AC (RS-485 F4F5 bus) on an M5StickC Plus2 + M5Stack RS485 Hat.
#
# BASE configuration: this is the file the ESPHome Device Builder adopts (dashboard_import
# below), so an adopted device keeps its own config (API key, name, extras) and is updated with
# "Install" in the Device Builder. It has no "Firmware Update" entity on purpose;
# "Update Available" / "Latest Version" report new releases (core/update-check.yaml).
# The firmware published to the web installer is built from hisense-m5stickc-plus2.factory.yaml, which
# includes this file and adds core/auto-update.yaml (update entity + OTA over HTTPS).
#
# A device config only composes packages:  core (brand agnostic) + board + brand.
substitutions:
  name: hisense-ac
  friendly_name: Hisense AC
  project_version: "0.2.11"
  # Build source shown in "Firmware Version": CI sets "release" (tags) or "main @<commit>";
  # "self-built" means built from the github:// package (Device Builder adoption) or a checkout.
  firmware_source: "self-built"
  # Release manifest of this board on GitHub Pages ("Latest Version" / "Update Available").
  update_manifest_url: https://skydoy.github.io/ESPHome_AC/firmware/manifest.json

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: skydoy.esphome-ac
    version: ${project_version}

# Lets the ESPHome Device Builder "adopt" a device flashed from the web installer. The adopted
# YAML imports this file pinned to the release tag of the running firmware (immutable, so the
# Device Builder's git cache can never serve an old copy, and it matches the component tag).
# To update an adopted device, change the tag in its packages: line and press Install.
dashboard_import:
  package_import_url: github://skydoy/ESPHome_AC/devices/hisense-m5stickc-plus2.yaml@v${project_version}
  import_full_config: false

packages:
  # Hardware
  board: !include ../core/boards/m5stickc-plus2.yaml
  screen: !include ../core/screen/m5stickc-plus2.yaml
  # Brand / protocol
  brand: !include ../brands/hisense/hisense-ac.yaml
  # Brand-agnostic services
  provisioning: !include ../core/provisioning.yaml
  diagnostics: !include ../core/diagnostics.yaml
  web_server: !include ../core/web-server.yaml
  update_check: !include ../core/update-check.yaml   # reports new releases, never installs
