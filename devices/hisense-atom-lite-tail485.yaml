# Device: Hisense AC (RS-485 F4F5 bus) on an M5Stack ATOM Lite + ATOM Tail485
# (cheapest option, no screen: RGB status LED and a button, see core/boards/atom-lite.yaml).
#
# BASE configuration: this is the file the ESPHome Device Builder adopts (dashboard_import
# below), so an adopted device keeps its own config (API key, name, extras) and is updated with
# "Install" in the Device Builder. It has no "Firmware Update" entity on purpose.
# The firmware published to the web installer is built from hisense-atom-lite-tail485.factory.yaml, which
# includes this file and adds core/auto-update.yaml (update entity + OTA over HTTPS).
#
# A device config only composes packages:  core (brand agnostic) + board + brand.
substitutions:
  name: hisense-ac-atom
  friendly_name: Hisense AC
  project_version: "0.2.9"
  # Build source shown in "Firmware Version": CI sets "release" (tags) or "main @<commit>";
  # "main" means built from the github:// package (Device Builder adoption) or a checkout.
  firmware_source: "main"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: skydoy.esphome-ac
    version: ${project_version}

# Lets the ESPHome Dashboard / Home Assistant "adopt" a device flashed from the web installer.
dashboard_import:
  package_import_url: github://skydoy/ESPHome_AC/devices/hisense-atom-lite-tail485.yaml@main
  import_full_config: false

packages:
  # Hardware
  board: !include ../core/boards/atom-lite.yaml      # includes the status LED and button
  # Brand / protocol
  brand: !include ../brands/hisense/hisense-ac.yaml
  # Brand-agnostic services
  provisioning: !include ../core/provisioning.yaml
  diagnostics: !include ../core/diagnostics.yaml
  web_server: !include ../core/web-server.yaml
