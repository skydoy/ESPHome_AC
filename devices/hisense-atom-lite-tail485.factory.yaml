# FACTORY firmware: ATOM Lite + ATOM Tail485.
#
# Built by GitHub Actions on every v* tag and published to the ESP Web Tools installer at
# https://skydoy.github.io/ESPHome_AC/ . It is the base config (hisense-atom-lite-tail485.yaml) plus a
# "Firmware Update" entity that installs new releases from GitHub Pages over HTTPS.
#
# Do not adopt or include this file in your own config: the update entity would replace your
# config with the generic firmware (and drop your API encryption key). Adopting a device in the
# ESPHome Device Builder imports the base file instead (see dashboard_import there).
packages:
  device: !include hisense-atom-lite-tail485.yaml
  auto_update: !include ../core/auto-update.yaml
