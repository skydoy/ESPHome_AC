# SETUP firmware: M5Stack ATOM Lite + ATOM Tail485.
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# Flash this when you do not know yet which AC you have. It detects the AC (read-only requests)
# at http://<device-ip>/setup and then installs the matching firmware of this board over the air.
# LED: blue = no Wi-Fi, red = no AC found (yet), green = AC found.
substitutions:
  name: esphome-ac-setup
  friendly_name: ESPHome AC Setup
  project_version: "0.3.0-beta.1"
  setup_board: atom-lite-tail485
  setup_manifest_url: https://skydoy.github.io/ESPHome_AC/firmware/atom-lite-tail485/manifest.json

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: skydoy.esphome-ac-setup
    version: ${project_version}

packages:
  board: !include ../core/boards/atom-lite.yaml
  setup: !include ../core/setup.yaml

# The board's status LED reads the generic ids ac_link / ac_fault.
binary_sensor:
  - platform: template
    id: ac_link
    internal: true
    lambda: return id(ac_setup_id).ac_link();
  - platform: template
    id: ac_fault
    internal: true
    lambda: return id(ac_setup_id).ac_fault();
