# Device: Hisense AC (RS-485 F4F5 bus) on an M5StickC Plus or Plus SE + M5Stack RS485 Hat.
#
# BASE configuration: this is the file the ESPHome Device Builder adopts (dashboard_import
# below), so an adopted device keeps its own config (API key, name, extras) and is updated with
# "Install" in the Device Builder. It has no "Firmware Update" entity on purpose;
# "Update Available" / "Latest Version" report new releases (core/update-check.yaml).
# The firmware published to the web installer is built from esphome-ac-m5stickc-plus.factory.yaml,
# which includes this file and adds core/auto-update.yaml (update entity + OTA over HTTPS).
#
# This board was added after v0.3.0, so it has no legacy "hisense-ac" build: it uses the
# brand-neutral names and the install/ manifest from the start.
#
# A device config only composes packages:  core (brand agnostic) + board + brand.
substitutions:
  name: esphome-ac-plus
  friendly_name: Air Conditioner
  project_version: "0.5.1"
  # Build source shown in "Firmware Version": CI sets "release" (tags) or "main @<commit>";
  # "self-built" means built from the github:// package (Device Builder adoption) or a checkout.
  firmware_source: "self-built"
  # Release manifest of this board on GitHub Pages ("Latest Version" / "Update Available").
  update_manifest_url: https://skydoy.github.io/ESPHome_AC/install/m5stickc-plus/manifest.json

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: skydoy.esphome-ac
    version: ${project_version}

# Lets the ESPHome Device Builder "adopt" a device flashed from the web installer. The adopted
# YAML imports this file from the "stable" branch, which CI moves to every release tag, so
# pressing "Install" builds the latest release with no YAML edits. The component is still
# pinned to v${project_version} (brands/hisense/hisense-ac.yaml), so packages and component
# always come from the same release, even from a stale Device Builder git cache.
dashboard_import:
  package_import_url: github://skydoy/ESPHome_AC/devices/hisense-m5stickc-plus.yaml@stable
  import_full_config: false

packages:
  # Hardware
  board: !include ../core/boards/m5stickc-plus.yaml
  screen: !include ../core/screen/m5stickc-plus2.yaml   # same LCD as the Plus2
  # Brand / protocol
  brand: !include ../brands/hisense/hisense-ac.yaml
  # Brand-agnostic services
  provisioning: !include ../core/provisioning.yaml
  diagnostics: !include ../core/diagnostics.yaml
  filter_reminder: !include ../core/filter-reminder.yaml   # "Filter Needs Cleaning"
  web_server: !include ../core/web-server.yaml
  update_check: !include ../core/update-check.yaml   # reports new releases, never installs
