# Status screen for the built-in 1.14" ST7789V LCD (240x135 landscape) of the M5StickC Plus2.
#
#   +--------------------------------------+
#   | Hisense AC                  (o) OK   |   link: OK / Handshake / Searching / No link
#   |                              SET     |
#   |  23°                         22°     |   big room temperature, target temperature
#   |                              COOL    |   mode
#   | Out 14°            192.168.1.40      |   hint line: fault code, setup or wiring hints
#   +--------------------------------------+
#
# Brand agnostic: it only reads these generic ids, which every brand package must provide
# (a template entity is fine if a brand has no such value):
#
#   ac_climate             climate        the AC
#   ac_link                binary_sensor  ON when the AC answers on its bus
#   ac_link_status         text_sensor    short link state text ("Connected", "Handshake", ...)
#   ac_fault               binary_sensor  ON when the AC reports a fault
#   ac_fault_codes         text_sensor    fault description ("OK" when none)
#   ac_outdoor_temperature sensor         outdoor temperature in °C (NaN when unknown)
#
# After boot a splash (logo, "ESPHome AC" and the firmware version) is shown for about
# ${splash_ms} ms, then the status page.
#
# Uses "reset_reason" from core/diagnostics.yaml to flag brownouts (weak 5 V supply).
#
# Redraws only when something shown changes (checked every ${screen_check_ms} ms) and never while
# the backlight is off, so the SPI bus and the CPU stay idle most of the time.
#
# OTA updates (Device Builder "Install", or the "Firmware Update" entity of the factory firmware)
# show a progress bar. The OTA download blocks the main loop, so this hooks ESPHome's OTA state
# listener (enabled by any ota on_* automation, see core/provisioning.yaml) and draws directly.
#
# The backlight turns off ${screen_timeout_ms} ms after the last wake-up. It wakes on a press of
# button A or B, or when something changes (mode, set point, link state, fault). The buttons
# only wake the screen; they never control the AC. During the first 5 minutes after boot the
# screen stays on while Wi-Fi or the AC link is down, so problems are visible while installing.
substitutions:
  screen_timeout_ms: "30000"
  screen_brightness: 60%
  splash_ms: "2500"
  screen_check_ms: "500"

spi:
  id: lcd_spi
  clk_pin: GPIO13
  mosi_pin:
    number: GPIO15
    ignore_strapping_warning: true   # fixed LCD wiring on the Plus2

globals:
  - id: screen_awake_until
    type: uint32_t
    initial_value: "0"
  - id: screen_signature
    type: uint32_t
    initial_value: "0"
  - id: link_down_since
    type: uint32_t
    initial_value: "0"
  - id: link_hint_logged
    type: bool
    initial_value: "false"
  - id: splash_until
    type: uint32_t
    initial_value: "0"
  - id: screen_drawn_signature
    type: uint32_t
    initial_value: "0"
  # -1 idle, 0..100 OTA progress in %, -2 the last OTA failed (shown until the screen sleeps).
  - id: ota_progress
    type: int
    initial_value: "-1"

font:
  - file: "gfonts://Roboto@500"
    id: font_big
    size: 64
    glyphs: "0123456789-°"
  - file: "gfonts://Roboto@500"
    id: font_mid
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

image:
  # 110x110 project badge (docs/icon.png) on the splash background. Fetched by URL so that
  # github:// packages, remote builds and the Device Builder bundle all find it.
  - platform: file
    file: https://raw.githubusercontent.com/skydoy/ESPHome_AC/main/core/screen/splash_badge.png
    id: splash_badge
    type: RGB565
    resize: 110x110

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true

script:
  - id: wake_screen
    mode: restart
    then:
      - lambda: id(screen_awake_until) = millis() + ${screen_timeout_ms};
      - light.turn_on:
          id: lcd_backlight
          brightness: ${screen_brightness}
      - component.update: lcd

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            #ifdef USE_OTA_STATE_LISTENER
              // OTA progress screen. Runs inside the OTA code while the main loop is blocked, so
              // drive the backlight PWM directly (the light component cannot run) and draw now.
              struct OtaScreen : public ota::OTAGlobalStateListener {
                void on_ota_global_state(ota::OTAState state, float progress, uint8_t error,
                                         ota::OTAComponent *component) override {
                  int p = id(ota_progress);
                  switch (state) {
                    case ota::OTA_STARTED: p = 0; break;
                    case ota::OTA_IN_PROGRESS: p = (int) progress; break;
                    case ota::OTA_COMPLETED: p = 100; break;
                    case ota::OTA_ERROR:
                    case ota::OTA_ABORT: p = -2; break;
                    default: return;
                  }
                  if (p > 100)
                    p = 100;
                  if (p == id(ota_progress))
                    return;
                  id(ota_progress) = p;
                  id(screen_awake_until) = millis() + ${screen_timeout_ms};
                  if (p >= 0)
                    id(lcd_backlight_pwm).set_level(0.6f);
                  id(lcd).update();
                  if (p < 0)
                    id(wake_screen).execute();  // the loop runs again: sync the light state
                  (void) error;
                  (void) component;
                }
              };
              static OtaScreen ota_screen;
              ota::get_global_ota_callback()->add_global_state_listener(&ota_screen);
            #endif
        - script.execute: wake_screen
        - delay: ${splash_ms}ms
        - lambda: id(splash_until) = 1;  // splash done
        - component.update: lcd

binary_sensor:
  - id: !extend button_a
    on_press:
      - script.execute: wake_screen
  - id: !extend button_b
    on_press:
      - script.execute: wake_screen

interval:
  - interval: ${screen_check_ms}ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          auto *ac = id(ac_climate);
          const bool link = id(ac_link).state;

          // Remember when the link went down, and log a wiring hint once after 60 s.
          if (link) {
            id(link_down_since) = 0;
            id(link_hint_logged) = false;
          } else if (id(link_down_since) == 0) {
            id(link_down_since) = now == 0 ? 1 : now;
          } else if (!id(link_hint_logged) && now - id(link_down_since) > 60000) {
            id(link_hint_logged) = true;
            ESP_LOGW("screen", "No answer from the AC for 60 s. Check: X/GND power, A and B "
                               "not swapped (try swapping them), AC switched on at the breaker. "
                               "If the Stick only boots from USB and not from the AC, add a 10k "
                               "pull-up from G0 to 3.3V (see docs/wiring.md).");
          }

          // Wake the screen when anything important changes (mode, set point, link, fault).
          auto mix = [](uint32_t h, uint32_t v) { return (h ^ v) * 16777619u; };
          auto mix_str = [&mix](uint32_t h, const std::string &str) {
            for (char c : str)
              h = mix(h, (uint8_t) c);
            return mix(h, 0xFFu);
          };
          auto rnd = [](float v) -> uint32_t { return std::isnan(v) ? 0xFFFFu : (uint32_t) (lroundf(v) + 1000); };
          uint32_t sig = 2166136261u;
          sig = mix(sig, (uint32_t) ac->mode);
          sig = mix(sig, rnd(ac->target_temperature));
          sig = mix(sig, link ? 1 : 0);
          sig = mix(sig, id(ac_fault).state ? 1 : 0);
          sig = mix_str(sig, id(ac_link_status).state);
          if (sig != id(screen_signature)) {
            const bool first = id(screen_signature) == 0;
            id(screen_signature) = sig;
            if (!first) {
              id(wake_screen).execute();
              return;  // wake_screen just redrew everything
            }
          }

          // Install window: keep the screen on while something needs attention.
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          if ((!wifi_ok || !link) && now < 5 * 60 * 1000)
            id(screen_awake_until) = now + ${screen_timeout_ms};

          const bool on = id(lcd_backlight).current_values.is_on();
          if (on && (int32_t) (now - id(screen_awake_until)) > 0) {
            auto call = id(lcd_backlight).turn_off();
            call.perform();
            if (id(ota_progress) == -2)
              id(ota_progress) = -1;  // the "update failed" note goes away with the screen
            return;
          }
          if (!on || id(splash_until) == 0)
            return;

          // Redraw only when something on the status page changed.
          uint32_t d = sig;
          d = mix(d, rnd(ac->current_temperature));
          d = mix(d, wifi_ok ? 1 : 0);
          d = mix(d, (uint32_t) id(ota_progress));
          d = mix(d, (!link && id(link_down_since) != 0 && now - id(link_down_since) > 60000) ? 1 : 0);
          d = mix(d, now < 5 * 60 * 1000 ? 1 : 0);
          if (id(ac_fault).state)
            d = mix_str(d, id(ac_fault_codes).state);
          else
            d = mix_str(mix(d, rnd(id(ac_outdoor_temperature).state)), id(wifi_ip).state);
          if (d != id(screen_drawn_signature)) {
            id(screen_drawn_signature) = d;
            id(lcd).update();
          }

display:
  - platform: mipi_spi
    id: lcd
    spi_id: lcd_spi
    model: ST7789V
    cs_pin:
      number: GPIO5
      ignore_strapping_warning: true
    dc_pin: GPIO14
    reset_pin:
      number: GPIO12
      ignore_strapping_warning: true
    dimensions:
      width: 135
      height: 240
      offset_width: 52
      offset_height: 40
    invert_colors: true
    rotation: 90
    buffer_size: 25%
    # Drawn on demand only (wake_screen, the change check above, OTA progress).
    update_interval: never
    lambda: |-
      const Color grey(150, 150, 150);
      const Color green(60, 200, 90);
      const Color amber(255, 170, 0);
      const Color red(235, 60, 60);
      const Color blue(70, 160, 255);
      const Color orange(255, 120, 40);
      const int W = it.get_width();   // 240
      const int H = it.get_height();  // 135
      it.fill(Color::BLACK);

      // OTA update in progress (or just failed): progress bar, even if the light is off.
      const int ota = id(ota_progress);
      if (ota != -1) {
        it.print(W / 2, 18, id(font_mid), Color::WHITE, TextAlign::TOP_CENTER,
                 ota == -2 ? "Update failed" : "Updating");
        if (ota >= 0) {
          it.rectangle(20, 62, W - 40, 22, grey);
          it.filled_rectangle(22, 64, (W - 44) * ota / 100, 18, blue);
          it.printf(W / 2, 92, id(font_mid), Color::WHITE, TextAlign::TOP_CENTER, "%d%%", ota);
          it.print(W / 2, H - 18, id(font_small), grey, TextAlign::TOP_CENTER,
                   ota >= 100 ? "Rebooting..." : "Do not unplug");
        } else {
          it.print(W / 2, 70, id(font_small), grey, TextAlign::TOP_CENTER, "Running the old firmware.");
          it.print(W / 2, 90, id(font_small), grey, TextAlign::TOP_CENTER, "See the logs for details.");
        }
        return;
      }
      if (!id(lcd_backlight).current_values.is_on())
        return;  // Screen is off; skip the drawing work.

      // Boot splash: logo, name and firmware version (until on_boot clears it).
      if (id(splash_until) == 0) {
        it.fill(Color(8, 18, 40));
        it.image(6, 12, id(splash_badge));
        const int cx = 124 + (W - 4 - 124) / 2;
        it.print(cx, 32, id(font_mid), Color::WHITE, TextAlign::TOP_CENTER, "ESPHome");
        it.print(cx, 60, id(font_mid), blue, TextAlign::TOP_CENTER, "AC");
      #ifdef ESPHOME_PROJECT_VERSION
        it.printf(cx, 96, id(font_small), grey, TextAlign::TOP_CENTER, "v%s", ESPHOME_PROJECT_VERSION);
      #endif
        return;
      }
      auto *ac = id(ac_climate);
      const bool link = id(ac_link).state;
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const std::string &ls = id(ac_link_status).state;

      // Top bar: name and link indicator.
      it.print(4, 4, id(font_small), grey, "${friendly_name}");
      const char *link_txt = "No link";
      Color link_col = red;
      if (link) {
        link_txt = "OK";
        link_col = green;
      } else if (ls == "Handshake" || ls == "Searching") {
        link_txt = ls.c_str();
        link_col = amber;
      }
      int bx, by, bw, bh;
      it.get_text_bounds(W - 4, 4, link_txt, id(font_small), TextAlign::TOP_RIGHT, &bx, &by, &bw, &bh);
      it.print(W - 4, 4, id(font_small), link_col, TextAlign::TOP_RIGHT, link_txt);
      it.filled_circle(bx - 9, 4 + bh / 2, 5, link_col);

      // Big room temperature.
      const float room = ac->current_temperature;
      if (std::isnan(room))
        it.print(4, 22, id(font_big), Color::WHITE, "--°");
      else
        it.printf(4, 22, id(font_big), Color::WHITE, "%.0f°", room);

      // Right column: target temperature and mode.
      const char *mode = "OFF";
      Color mode_col = grey;
      switch (ac->mode) {
        case climate::CLIMATE_MODE_COOL: mode = "COOL"; mode_col = blue; break;
        case climate::CLIMATE_MODE_HEAT: mode = "HEAT"; mode_col = orange; break;
        case climate::CLIMATE_MODE_DRY: mode = "DRY"; mode_col = Color(80, 220, 220); break;
        case climate::CLIMATE_MODE_FAN_ONLY: mode = "FAN"; mode_col = Color::WHITE; break;
        case climate::CLIMATE_MODE_HEAT_COOL:
        case climate::CLIMATE_MODE_AUTO: mode = "AUTO"; mode_col = green; break;
        default: break;
      }
      it.print(W - 4, 28, id(font_small), grey, TextAlign::TOP_RIGHT, "SET");
      if (!link || std::isnan(ac->target_temperature))
        it.print(W - 4, 44, id(font_mid), Color::WHITE, TextAlign::TOP_RIGHT, "--");
      else
        it.printf(W - 4, 44, id(font_mid), Color::WHITE, TextAlign::TOP_RIGHT, "%.0f°", ac->target_temperature);
      it.print(W - 4, 76, id(font_mid), link ? mode_col : grey, TextAlign::TOP_RIGHT, link ? mode : "-");

      // Hint line, most important first.
      const int y = H - 20;
      const uint32_t now = millis();
      const bool link_lost_long = !link && id(link_down_since) != 0 && now - id(link_down_since) > 60000;
      const std::string &boot = id(reset_reason).state;
      if (id(ac_fault).state) {
        std::string f = id(ac_fault_codes).has_state() ? id(ac_fault_codes).state : std::string("see Home Assistant");
        if (f.size() > 26)
          f = f.substr(0, 25) + "~";
        it.printf(4, y, id(font_small), red, "Fault: %s", f.c_str());
      } else if (!wifi_ok) {
        it.print(4, y, id(font_small), amber, "Wi-Fi: join \"Hisense-AC Setup\"");
      } else if (now < 5 * 60 * 1000 && boot.find("brownout") != std::string::npos) {
        it.print(4, y, id(font_small), amber, "Brownout reset: check 5V supply");
      } else if (link_lost_long) {
        it.print(4, y, id(font_small), red, "No AC: swap A/B? G0 10k pull-up?");
      } else {
        const float out = id(ac_outdoor_temperature).state;
        if (!std::isnan(out))
          it.printf(4, y, id(font_small), grey, "Out %.0f°", out);
        it.print(W - 4, y, id(font_small), grey, TextAlign::TOP_RIGHT, id(wifi_ip).state.c_str());
      }
