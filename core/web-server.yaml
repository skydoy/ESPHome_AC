# Local web page at http://<device-ip>/ : entity states, controls and live logs.
# Version 3 UI. The page's JS/CSS comes from the ESPHome CDN, so the browser needs internet.
# Not local: true: in local mode ESPHome serves its own prebuilt page, which never loads
# js_include, so web-ui.js (AC diagram, PT/EN, favicon, Byte Hunt CSV) would not run.
# NO authentication: anyone on the LAN can view and control the
# device. To add a login, set `auth:` in your own config; to remove the page, override the
# package with `web_server: !remove`. See docs/configuration.md#web-server.
web_server:
  port: 80
  version: 3
  log: true
  # web-ui.js: caps the debug log panel height and draws the live AC diagram (PT/EN).
  # Path resolves next to this file; only one js_include is allowed — merge here.
  js_include: web-ui.js
