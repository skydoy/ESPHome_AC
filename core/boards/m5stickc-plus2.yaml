# Board: M5StickC Plus2 (ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM).
#
# Brand agnostic. "ac_tx_pin"/"ac_rx_pin" are the UART pins of the Hat header that brand
# packages use to talk to the AC (official M5Stack pin map for Hat RS485: TX = G0, RX = G26).
# A different hat/adapter on the same pins only needs a different brand package; see
# adapters/README.md.
substitutions:
  ac_tx_pin: GPIO0
  ac_rx_pin: GPIO26

esp32:
  board: esp32dev        # ESP32-PICO-V3-02; there is no dedicated PlatformIO board for the Plus2
  flash_size: 8MB
  framework:
    type: esp-idf

output:
  # HOLD (G4) must stay HIGH or the Plus2 switches itself off when it is not on USB power.
  - platform: gpio
    id: power_hold
    pin: GPIO4
  # LCD backlight (G27). Controlled by core/screen/m5stickc-plus2.yaml (auto-off after 30 s).
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO27

esphome:
  on_boot:
    - priority: 1000
      then:
        - output.turn_on: power_hold

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    internal: true

binary_sensor:
  # Buttons A (front, "M5") and B (side) only wake the status screen; they never control the
  # AC. See core/screen/m5stickc-plus2.yaml.
  - platform: gpio
    id: button_a
    pin: { number: GPIO37, inverted: true }
    name: "Button A"
    entity_category: diagnostic
  - platform: gpio
    id: button_b
    pin: { number: GPIO39, inverted: true }
    name: "Button B"
    entity_category: diagnostic

sensor:
  - platform: adc
    pin: GPIO38
    name: "Stick Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    entity_category: diagnostic
    filters:
      - multiply: 2.0

# Notes:
# - Do not enable the built-in microphone (SPM1423 uses G0 as its clock) or I2S on G0/G26:
#   those pins belong to the hat.
# - G19 drives the red LED and the IR transmitter. It is intentionally unused.
# - G0 is a boot strapping pin. If the Stick does not boot when powered from the AC, add a
#   10k pull-up from G0 to 3.3V (see docs/wiring.md).
