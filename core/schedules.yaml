number:
  - platform: template
    id: early_start_max
    name: "Early Start Max"
    icon: mdi:clock-fast
    unit_of_measurement: "min"
    entity_category: config
    min_value: 0
    max_value: 180
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 60
