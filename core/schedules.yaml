# Schedules stored on the device (brand agnostic: drives the climate entity "ac_climate").
#
# 4 schedules, each with these Home Assistant entities (category Configuration):
#   switch   "Schedule N"              on = active
#   time     "Schedule N Time"         HH:MM, local time
#   select   "Schedule N Days"         Every day / Weekdays / Weekend / Monday ... Sunday
#   select   "Schedule N Action"       Off / Cool / Heat / Auto / Dry / Fan
#   number   "Schedule N Temperature"  16-32 degC (not used by Off and Fan)
#   select   "Schedule N Fan"          Keep / Auto / Low / Medium / High / Quiet
# They run without Home Assistant: the clock comes from Home Assistant or, without it, from
# internet time (SNTP) with the time zone Home Assistant last sent (core/diagnostics.yaml).
# Everything is kept across restarts and updates. A schedule fires once, at its minute.

