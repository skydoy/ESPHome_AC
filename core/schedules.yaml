# Schedules stored on the device (brand agnostic: drives the climate entity "ac_climate").
#
# 4 schedules, each with these Home Assistant entities (category Configuration):
#   switch   "Schedule N"              on = active
#   time     "Schedule N Time"         HH:MM, local time
#   select   "Schedule N Days"         Every day / Weekdays / Weekend / Monday ... Sunday
#   select   "Schedule N Action"       Off / Cool / Heat / Auto / Dry / Fan
#   number   "Schedule N Temperature"  16-32 degC (not used by Off and Fan)
#   select   "Schedule N Fan"          Keep / Auto / Low / Medium / High / Quiet
# They run without Home Assistant: the clock comes from Home Assistant or, without it, from
# internet time (SNTP) with the time zone Home Assistant last sent (core/diagnostics.yaml).
# Everything is kept across restarts and updates. A schedule fires once, at its minute.
#
# Early start ("Schedule Early Start" switch, off by default): Heat and Cool schedules start
# early so the room is at the temperature AT the schedule time. The device learns how fast the
# room heats / cools ("Learned Heating / Cooling Rate", from Heating / Cooling Rate) and starts
# (degrees to go / rate) before, at most "Early Start Max" minutes (default 60).

globals:
  - id: learned_heat_rate
    type: float
    restore_value: true
    initial_value: "0"
  - id: learned_cool_rate
    type: float
    restore_value: true
    initial_value: "0"

sensor:
  - platform: template
    id: learned_heat
    name: "Learned Heating Rate"
    icon: mdi:school-outline
    unit_of_measurement: "°C/h"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: learned_cool
    name: "Learned Cooling Rate"
    icon: mdi:school-outline
    unit_of_measurement: "°C/h"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never

