interval:
  - interval: 15s
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid())
            now = id(sntp_time).now();
          if (!now.is_valid())
            return;
          struct Sched {
            switch_::Switch *on;
            datetime::TimeEntity *time;
            select::Select *days;
            select::Select *action;
            number::Number *temp;
            select::Select *fan;
          };
          static const Sched S[4] = {
              {id(sched1_on), id(sched1_time), id(sched1_days), id(sched1_action), id(sched1_temp), id(sched1_fan)},
              {id(sched2_on), id(sched2_time), id(sched2_days), id(sched2_action), id(sched2_temp), id(sched2_fan)},
              {id(sched3_on), id(sched3_time), id(sched3_days), id(sched3_action), id(sched3_temp), id(sched3_fan)},
              {id(sched4_on), id(sched4_time), id(sched4_days), id(sched4_action), id(sched4_temp), id(sched4_fan)}
          };
          // Learn how fast the room heats / cools (degC per hour), slowly (EMA), for early start.
          static uint32_t learn_tick = 0;
          if (++learn_tick % 4 == 0) {   // once a minute
            const float hr = id(heating_rate).state, cr = id(cooling_rate).state;
            if (!std::isnan(hr) && hr > 0.2f && hr < 15.0f)
              id(learned_heat_rate) = id(learned_heat_rate) <= 0 ? hr : id(learned_heat_rate) * 0.97f + hr * 0.03f;
            if (!std::isnan(cr) && cr > 0.2f && cr < 15.0f)
              id(learned_cool_rate) = id(learned_cool_rate) <= 0 ? cr : id(learned_cool_rate) * 0.97f + cr * 0.03f;
            if (id(learned_heat_rate) > 0) id(learned_heat).publish_state(id(learned_heat_rate));
            if (id(learned_cool_rate) > 0) id(learned_cool).publish_state(id(learned_cool_rate));
          }
          static uint32_t fired_on[4] = {0, 0, 0, 0};   // minute-epoch of the occurrence already run
          const uint32_t now_min = (uint32_t) (now.timestamp / 60);
          const int now_mod = now.hour * 60 + now.minute;
          const float room = id(ac_climate).current_temperature;
          for (int i = 0; i < 4; i++) {
            const Sched &s = S[i];
            if (!s.on->state || !s.time->has_state())
              continue;
            const int a = s.action->active_index().value_or(0);
            // Early start (Heat / Cool only): lead time = degrees to go / learned rate.
            int lead = 0;
            if (id(early_start_switch).state && !std::isnan(room) && (a == 1 || a == 2)) {
              const float rate = a == 2 ? id(learned_heat_rate) : id(learned_cool_rate);
              const float diff = a == 2 ? s.temp->state - room : room - s.temp->state;
              if (rate > 0 && diff > 0)
                lead = std::min((int) lroundf(diff / rate * 60.0f), (int) id(early_start_max).state);
            }
            // Minutes until the next occurrence of this schedule's time (0 = now).
            int until = s.time->hour * 60 + s.time->minute - now_mod;
            if (until < 0)
              until += 1440;
            if (until > lead)
              continue;
            const uint32_t occurrence = now_min + until;
            if (fired_on[i] == occurrence)
              continue;
            // Days of the occurrence: 0 every day, 1 weekdays, 2 weekend, 3..9 Monday..Sunday.
            // ESPTime day_of_week: 1 = Sunday ... 7 = Saturday.
            const int d = s.days->active_index().value_or(0);
            int dow = now.day_of_week;
            if (now_mod + until >= 1440)
              dow = dow % 7 + 1;  // the occurrence is tomorrow
            const bool weekend = dow == 1 || dow == 7;
            const int monday_based = dow == 1 ? 7 : dow - 1;  // 1 = Monday ... 7 = Sunday
            bool today = d == 0 || (d == 1 && !weekend) || (d == 2 && weekend) || (d >= 3 && d - 2 == monday_based);
            if (!today)
              continue;
            fired_on[i] = occurrence;
            if (until > 0)
              ESP_LOGI("schedule", "Schedule %d: early start, %d min before %02d:%02d", i + 1, until,
                       s.time->hour, s.time->minute);
            auto call = id(ac_climate).make_call();
            static const climate::ClimateMode MODES[] = {
                climate::CLIMATE_MODE_OFF, climate::CLIMATE_MODE_COOL, climate::CLIMATE_MODE_HEAT,
                climate::CLIMATE_MODE_AUTO, climate::CLIMATE_MODE_DRY, climate::CLIMATE_MODE_FAN_ONLY};
            call.set_mode(MODES[a]);
            if (a != 0 && a != 5)
              call.set_target_temperature(s.temp->state);
            const int f = s.fan->active_index().value_or(0);
            if (a != 0 && f != 0) {
              static const climate::ClimateFanMode FANS[] = {
                  climate::CLIMATE_FAN_AUTO, climate::CLIMATE_FAN_AUTO, climate::CLIMATE_FAN_LOW,
                  climate::CLIMATE_FAN_MEDIUM, climate::CLIMATE_FAN_HIGH, climate::CLIMATE_FAN_QUIET};
              call.set_fan_mode(FANS[f]);
            }
            ESP_LOGI("schedule", "Schedule %d: %s %s, %.0f degC, fan %s", i + 1,
                     s.days->current_option().c_str(), s.action->current_option().c_str(),
                     s.temp->state, s.fan->current_option().c_str());
            call.perform();
          }
