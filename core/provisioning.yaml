# Generic firmware (no credentials baked in). Wi-Fi is set up with ESP Web Tools
# (Improv Serial over USB), Improv over BLE, or the fallback hotspot + captive portal.
#
wifi:
  ap:
    ssid: "ESPHome_AC Setup"
  # Bluetooth (Improv over BLE) is only for the first Wi-Fi setup. Once on Wi-Fi it is switched
  # off: the BLE stack holds ~40-60 kB of RAM, and boards without PSRAM (M5StickC Plus / Plus SE,
  # ATOM Lite) then lack the memory for the HTTPS update download ("PK verify failed with error
  # 0x4290" = RSA + out of memory). It comes back if Wi-Fi is lost, for a new setup.
  on_connect:
    - delay: 60s
    - if:
        condition:
          wifi.connected:
        then:
          - logger.log: "Wi-Fi up: Bluetooth setup off (frees RAM for HTTPS updates)"
          - ble.disable:
  on_disconnect:
    - ble.enable:
esp32_ble:
  id: ble
captive_portal:
improv_serial:
improv_ble:
  authorizer: none
api:
logger:

# The OTA automations below log the start and the result of every update, and also switch on
# ESPHome's OTA state listeners, which the status screen uses to draw a progress bar.
ota:
  - platform: esphome
    id: ota_esphome
    on_begin:
      - logger.log: "OTA update started (do not unplug)"
    on_end:
      - logger.log: "OTA update finished, rebooting"
    on_error:
      - logger.log:
          level: WARN
          format: "OTA update failed (error %u), still running the old firmware"
          args: [x]
