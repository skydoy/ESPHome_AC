# Common diagnostics for every device (brand agnostic).
# Also provides the time source "ha_time" that brand packages may use (e.g. daily energy).
substitutions:
  # Where this firmware was built from, shown next to the version in "Firmware Version".
  # The device config / CI override it: "release" for tagged builds, "main" for Device Builder
  # builds from the github:// package. Set it to anything ("" for none) in your own config.
  firmware_source: "custom"

time:
  - platform: homeassistant
    id: ha_time
    # Keep the time zone Home Assistant sends, so local time stays right without HA.
    on_time_sync:
      - lambda: |-
          const auto &tz = esphome::time::get_global_tz();
          if (!id(saved_tz_ok) || memcmp(&tz, &id(saved_tz), sizeof(tz)) != 0) {
            id(saved_tz) = tz;
            id(saved_tz_ok) = true;
            ESP_LOGI("time", "Time zone from Home Assistant saved");
          }
  # Internet time, for when Home Assistant is not connected (schedules, nightly update check).
  - platform: sntp
    id: sntp_time

globals:
  - id: saved_tz
    type: esphome::time::ParsedTimezone
    restore_value: true
    initial_value: "esphome::time::ParsedTimezone{}"
  - id: saved_tz_ok
    type: bool
    restore_value: true
    initial_value: "false"

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            if (id(saved_tz_ok))
              esphome::time::set_global_tz(id(saved_tz));

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
  # RAM left for HTTPS updates and the web page (boards without PSRAM run close to the limit).
  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic
    block:
      name: "Largest Free Block"
      entity_category: diagnostic

# Reset reason ("power-on event", "brownout", ...). The status screen flags brownouts, which
# usually mean the 5 V supply from the AC port is too weak or badly connected.
debug:
  update_interval: 60s   # Free Heap / Largest Free Block

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason
      name: "Reset Reason"
      entity_category: diagnostic
      on_value:
        - if:
            condition:
              lambda: return x.find("brownout") != std::string::npos;
            then:
              - logger.log:
                  level: WARN
                  format: "Brownout reset: the 5 V supply dipped. Check the X/GND wires (5 V or 12 V input, see docs/wiring.md)."
  # Project version (esphome: project: version) plus the build source, e.g. "0.2.6 (release)".
  - platform: template
    name: "Firmware Version"
    id: firmware_version
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: |-
      #ifdef ESPHOME_PROJECT_VERSION
      std::string v = ESPHOME_PROJECT_VERSION;
      #else
      std::string v = "unknown";
      #endif
      std::string src = "${firmware_source}";
      if (!src.empty()) v += " (" + src + ")";
      return v;
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    entity_category: config
