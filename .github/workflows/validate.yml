name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Protocol unit tests (host C++)
        run: make -C tests
  config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - devices/hisense-m5stickc-plus2.yaml
          - devices/hisense-atom-lite-tail485.yaml
          - devices/hisense-m5stickc-plus2.factory.yaml
          - devices/hisense-atom-lite-tail485.factory.yaml
          - devices/esphome-ac-m5stickc-plus2.factory.yaml
          - devices/esphome-ac-atom-lite-tail485.factory.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - name: Validate the device config against the local components
        run: |
          set -o pipefail
          esphome -s hisense_component_source ../components config ${{ matrix.device }} | tee config.txt
      - name: Only the factory firmware has the "Firmware Update" entity
        run: |
          if [[ "${{ matrix.device }}" == *.factory.yaml ]]; then
            grep -q "id: firmware_update" config.txt
            if grep -q "id: update_check$" config.txt; then
              echo "::error::Factory configs must drop core/update-check.yaml (duplicate of Firmware Update)"; exit 1; fi
          else
            if grep -qE "id: (firmware_update|ota_http)$" config.txt; then
              echo "::error::Base configs (adopted in the Device Builder) must not include auto-update"
              exit 1
            fi
            grep -q "id: check_for_update" config.txt
          fi
  setup-firmware:
    # Generic setup image (detects the AC, then installs the brand firmware). Built from this
    # checkout only; published nowhere yet, the binaries are kept as a workflow artifact.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [m5stickc-plus2, atom-lite-tail485]
    env:
      CFG: devices/setup-${{ matrix.board }}.yaml
      BUILD: devices/.esphome/build/esphome-ac-setup/build
      MAX_BYTES: "1200000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - name: No API, no brand package, no static Wi-Fi networks
        run: |
          set -o pipefail
          esphome config "$CFG" | tee config.txt
          if grep -qE "^(api|dashboard_import|climate):" config.txt; then
            echo "::error::The setup image must not contain api, dashboard_import or a climate"; exit 1; fi
          # A static network changes the Wi-Fi preference slot, so the brand firmware would not
          # find the credentials saved by the setup image.
          if grep -qE "^  networks:|^  ssid:" config.txt; then
            echo "::error::The setup image must not have static Wi-Fi networks"; exit 1; fi
          grep -q "next_url: http://{{ip_address}}/setup" config.txt
      - name: Compile (no warnings allowed)
        run: |
          set -o pipefail
          esphome compile "$CFG" 2>&1 | tee build.log
          if grep -E "warning:" build.log | grep -vE "/(\.platformio|\.espressif|managed_components)/"; then
            echo "::error::Compiler warnings in the setup image"; exit 1; fi
      - name: Size budget
        run: |
          size=$(stat -c %s "$BUILD/firmware.ota.bin")
          echo "firmware.ota.bin: $size bytes (max $MAX_BYTES)"
          test "$size" -le "$MAX_BYTES"
      - name: Only allow-listed Hisense frames are linked in
        run: |
          NM=$(find ~/.cache/esphome ~/.platformio ~/.espressif \( -type f -o -type l \) -name "xtensa-esp32-elf-nm" 2>/dev/null | head -n 1)
          echo "nm: $NM"
          test -n "$NM"
          "$NM" -C "$BUILD/firmware.elf" > syms.txt
          if grep -E "build_command|build_heartbeat|CommandQueue|hisense_ac::HisenseAC" syms.txt; then
            echo "::error::Brand command code is linked into the setup image"; exit 1; fi
          builders=$(grep -oE "hisense_ac::proto::build_[a-z_]+" syms.txt | sort -u)
          echo "$builders"
          extra=$(echo "$builders" | grep -vxE "hisense_ac::proto::build_(devtype|status|version)_request" || true)
          if [ -n "$extra" ]; then
            echo "::error::Unexpected frame builders: $extra"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: setup-${{ matrix.board }}
          path: |
            ${{ env.BUILD }}/firmware.factory.bin
            ${{ env.BUILD }}/firmware.ota.bin
          if-no-files-found: error
  pinned-refs:
    # Adoption follows @stable; the component is pinned to v<project_version> inside the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Same version in both boards; dashboard_import and component follow it
        run: |
          set -e
          v1=$(grep -oP '^\s*project_version: "\K[^"]+' devices/hisense-m5stickc-plus2.yaml)
          v2=$(grep -oP '^\s*project_version: "\K[^"]+' devices/hisense-atom-lite-tail485.yaml)
          echo "m5stickc-plus2=$v1 atom-lite=$v2"
          test "$v1" = "$v2"
          grep -q 'hisense_component_source: github://skydoy/ESPHome_AC@v${project_version}$' brands/hisense/hisense-ac.yaml
          for f in devices/hisense-m5stickc-plus2.yaml devices/hisense-atom-lite-tail485.yaml; do
            # Adoption follows the "stable" branch (CI moves it to each release tag).
            grep -q "package_import_url: github://skydoy/ESPHome_AC/$f@stable$" "$f"
          done
          if grep -rn "github://skydoy/ESPHome_AC[^ ]*@main" devices brands core; then
            echo "::error::Shipped configs must not reference @main"; exit 1; fi
