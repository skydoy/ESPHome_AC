name: Validate
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol unit tests (host C++)
        run: make -C tests
  config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - devices/hisense-m5stickc-plus2.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - name: Validate the device config against the local components
        run: esphome -s hisense_component_source ../components config ${{ matrix.device }}
