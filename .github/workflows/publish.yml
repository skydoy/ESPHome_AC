name: Build firmware & publish installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # One installer build per device. Each device has its own folder (and manifest.json) on
    # GitHub Pages. The M5StickC Plus2 keeps "firmware/" so existing OTA manifest URLs keep working.
    # The installer firmware is built from the *.factory.yaml (base config + "Firmware Update"
    # entity); the version and build source live in the base config, which it includes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: m5stickc-plus2
            base: devices/hisense-m5stickc-plus2.yaml
            factory: devices/hisense-m5stickc-plus2.factory.yaml
            site_dir: firmware
          - key: atom-lite-tail485
            base: devices/hisense-atom-lite-tail485.yaml
            factory: devices/hisense-atom-lite-tail485.factory.yaml
            site_dir: firmware/atom-lite-tail485
    env:
      BASE_YAML: ${{ matrix.base }}
      DEVICE_YAML: ${{ matrix.factory }}
      SITE_DIR: ${{ matrix.site_dir }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the components from this checkout (not from @main)
        run: sed -i 's|^\(\s*hisense_component_source:\).*|\1 ../components|' brands/hisense/hisense-ac.yaml
      - name: The tag must match project_version (adopted configs fetch the component at v<project_version>)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "^\s*project_version: \"${GITHUB_REF_NAME#v}\"$" "$BASE_YAML" || {
            echo "::error::$BASE_YAML project_version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Record the build source (shown in the "Firmware Version" sensor)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then src="release"; else src="${GITHUB_REF_NAME} @${GITHUB_SHA::7}"; fi
          sed -i "s|^\(\s*firmware_source:\).*|\1 \"$src\"|" "$BASE_YAML"
          grep -n "firmware_source:\|project_version:" "$BASE_YAML"
      - id: esphome
        uses: esphome/build-action@v8.1.0   # consider pinning to the release commit SHA
        with:
          yaml-file: ${{ env.DEVICE_YAML }}
          version: "2026.10.1"
          complete-manifest: true
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases
      - name: Stage the firmware in its Pages folder
        run: |
          mkdir -p "out/$SITE_DIR"
          cp -r "${{ steps.esphome.outputs.name }}"/* "out/$SITE_DIR/"
          ls -R out
      - uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.key }}
          path: out
          if-no-files-found: error
  pages:
    # Installer page + every device folder in one Pages artifact.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: site
      - name: Assemble Pages site
        run: |
          cp static/* site/
          ls -R site
          test -f site/firmware/manifest.json
          test -f site/firmware/atom-lite-tail485/manifest.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    # Publish the installer and the OTA manifest only for release tags (or a manual run).
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  release:
    # Create (or update) the GitHub Release for a v* tag: notes from CHANGELOG.md, images attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: fw
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f&&/^\[[^]]+\]: /{exit} f{print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No '## [$v]' section in CHANGELOG.md"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi
          # Relative links in the changelog point into the repository at this tag.
          sed -i -E "s#\]\(([^):#][^):]*)\)#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" notes.md
          {
            echo
            echo "---"
            echo "**Install or update:** flash from the [web installer](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/) (Chrome or Edge)."
            echo "Devices already running this firmware update over the air through the **Firmware Update** entity."
            echo "\`*.factory.bin\` is the full image for a first USB flash at offset 0x0; \`*.ota.bin\` is for manual OTA uploads."
          } >> notes.md
          cat notes.md
      - name: Prepare assets
        run: |
          mkdir assets
          for f in $(find fw -name '*.factory.bin' -o -name '*.ota.bin' | sort); do
            b=$(basename "$f"); cp "$f" "assets/${b%%.*}-${TAG}.${b#*.}"
          done
          test "$(ls assets | wc -l)" -ge 4   # factory + ota for every device
          (cd assets && sha256sum * > SHA256SUMS.txt)
          ls -l assets && cat assets/SHA256SUMS.txt
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
  stable:
    # Move the "stable" branch to this release tag. Adopted Device Builder configs import
    # devices/<board>.yaml@stable, so "Install" builds the latest release with no YAML edits.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Point refs/heads/stable at the tag commit
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$GITHUB_SHA"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --jq .object.sha)" = "$GITHUB_SHA"
          echo "stable -> $GITHUB_REF_NAME ($GITHUB_SHA)"
  verify-adoption:
    # After "stable" moved, resolve the exact YAML that the ESPHome Device Builder generates
    # when it adopts a device (dashboard_import shorthand @stable), with NO local overrides:
    # proves @stable serves this release and its component resolves to the same tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: stable
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [hisense-m5stickc-plus2, hisense-atom-lite-tail485]
    steps:
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - name: Validate the adopted config from GitHub
        run: |
          set -o pipefail
          cat > adopted.yaml <<EOF
          substitutions:
            name: adopted-test
          packages:
            skydoy.esphome-ac: github://skydoy/ESPHome_AC/devices/${{ matrix.device }}.yaml@stable
          esphome:
            name: \${name}
            name_add_mac_suffix: false
          wifi:
            ssid: test
            password: test12345
          EOF
          cat adopted.yaml
          esphome config adopted.yaml | tee config.txt
          grep -q "source: github://skydoy/ESPHome_AC@${GITHUB_REF_NAME}" config.txt
          grep -q "package_import_url: github://skydoy/ESPHome_AC/devices/${{ matrix.device }}.yaml@stable" config.txt
          grep -qE "^\s+version: ['\"]?${GITHUB_REF_NAME#v}['\"]?$" config.txt
